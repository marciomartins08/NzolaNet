<header class="sticky top-0 z-50 bg-white border-b border-gray-200">
  <div class="max-w-4xl mx-auto px-4 py-3">
    <div class="flex items-center justify-between">
          <div class="flex items-center gap-8">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent cursor-pointer"><a routerLink="/feed">NzolaNet</a>
            </h1>
          </div>
          <nav class="flex items-center gap-1 md:gap-2">
            @if(hasRoute('/usuarios')){
            <button routerLink="/usuarios" class="flex items-center gap-2 px-3 py-2 rounded-lg transition-colors bg-blue-100 text-blue-600">
                <div class="flex items-center px-2 gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
                        <path d="M400-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47Zm0-80q33 0 56.5-23.5T480-640q0-33-23.5-56.5T400-720q-33 0-56.5 23.5T320-640q0 33 23.5 56.5T400-560Zm0 320q-116 0-210-60.5T42-460q45-77 114.5-121.5T320-629q14 5 28 8t29 5q-12 24-19 50.5t-8 55.5q0 4 1 8t1 8q-52 5-96 29.5T184-460q38 41 87.5 65.5T380-370q16 0 31.5-1.5T427-376q-4 13-5 27t0 29H400Zm280-80v-80h-80v-80h80v-80h80v80h80v80h-80v80h-80Z"/>
                    </svg>
                    <span class="hidden sm:inline">Usuários</span>
                </div>
            </button>
            }@else {
              <button routerLink="/usuarios" class="flex items-center gap-2 px-3 py-2 rounded-lg transition-colors text-gray-600 hover:bg-gray-100">
                <div class="flex items-center px-2 gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
                        <path d="M400-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47Zm0-80q33 0 56.5-23.5T480-640q0-33-23.5-56.5T400-720q-33 0-56.5 23.5T320-640q0 33 23.5 56.5T400-560Zm0 320q-116 0-210-60.5T42-460q45-77 114.5-121.5T320-629q14 5 28 8t29 5q-12 24-19 50.5t-8 55.5q0 4 1 8t1 8q-52 5-96 29.5T184-460q38 41 87.5 65.5T380-370q16 0 31.5-1.5T427-376q-4 13-5 27t0 29H400Zm280-80v-80h-80v-80h80v-80h80v80h80v80h-80v80h-80Z"/>
                    </svg>
                    <span class="hidden sm:inline">Usuários</span>
                </div>
            </button>
            }
            @if(hasRoute('/feed')){
              <button routerLink="/feed" class="flex items-center gap-2 px-3 py-2 rounded-lg transition-colors bg-blue-100 text-blue-600">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0h6"/>
                </svg>
                  <span class="hidden md:inline text-sm">Feed</span>
              </button>
            }@else{
              <button routerLink="/feed" class="flex items-center gap-2 px-3 py-2 rounded-lg transition-colors text-gray-600 hover:bg-gray-100">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0h6"/>
                </svg>
                  <span class="hidden md:inline text-sm">Feed</span>
              </button>
            }

            @if(hasRoute('/notifications')){
              <button routerLink="/notifications" class="relative flex items-center gap-2 px-3 py-2 rounded-lg transition-colors bg-blue-100 text-blue-600">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 10-12 0v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                </svg>
                  <span class="hidden md:inline text-sm">Notificacoes</span>
              </button>
            }@else{
              <button routerLink="/notifications" class="relative flex items-center gap-2 px-3 py-2 rounded-lg transition-colors text-gray-600 hover:bg-gray-100">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 10-12 0v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                </svg>
                  <span class="hidden md:inline text-sm">Notificacoes</span>
              </button>
            }

            @if(hasRoute('/perfil')){
              <button routerLink="/perfil" class="relative flex items-center gap-2 px-3 py-2 rounded-lg transition-colors bg-blue-100 text-blue-600">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
                  <span class="hidden md:inline text-sm">Perfil</span>
              </button>
            }@else{
              <button routerLink="/perfil" class="relative flex items-center gap-2 px-3 py-2 rounded-lg transition-colors text-gray-600 hover:bg-gray-100">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
                  <span class="hidden md:inline text-sm">Perfil</span>
              </button>
            }

            @if(isAdmin()){
              @if(hasRoute('/admin')){
              <button routerLink="/admin" class="relative flex items-center gap-2 px-3 py-2 rounded-lg transition-colors bg-blue-100 text-blue-600">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                </svg>
                  <span class="hidden md:inline text-sm">Admin</span>
              </button>
              }@else{
              <button routerLink="/admin" class="relative flex items-center gap-2 px-3 py-2 rounded-lg transition-colors text-gray-600 hover:bg-gray-100">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                </svg>
                  <span class="hidden md:inline text-sm">Admin</span>
              </button>
              }
            }

            <button
              (click)="onLogout()"
              title="Terminar sessão"
              class="text-gray-600 hover:text-red-600 transition-colors p-2 rounded-lg hover:bg-gray-100"
            >
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
              </svg>
            </button>

          </nav>
    </div>
  </div>

</header>
