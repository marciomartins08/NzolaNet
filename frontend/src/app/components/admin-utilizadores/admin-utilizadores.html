 <div class="space-y-4">
    <div class="flex items-center justify-between">
        <div>
        <h2 class="text-xl font-bold text-gray-900">Gestão de Utilizadores</h2>
        <p class="text-sm text-gray-500 mt-1">{{totUsers()}} utilizadores registados</p>
        </div>
    </div>

    <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
      <table class="w-full">
        <thead class="bg-gray-50 border-b border-gray-200">
          <tr>
            <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide w-[35%] md:w-[30%]">
              Utilizador
            </th>
            <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide hidden md:table-cell md:w-[30%]">
              Email
            </th>
            <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide hidden lg:table-cell lg:w-[20%]">
              Registo
            </th>
            <th class="text-right px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide w-[20%] md:w-[15%]">
              Ações
            </th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          @for(user of users(); track user.id){
          <tr class="hover:bg-gray-50 transition-colors">
            <td class="px-4 py-3">
              <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-gray-50">
                <span class="text-sm font-bold text-gray-400 w-5">{{user.id}}</span>
                      <img
                src={{user.foto}}
                alt={{user.nome}}
                class="w-6 h-6 rounded-full object-cover"
              />
              <div class="flex-1">
                <p class="text-sm font-medium text-gray-900">{{user.nome}}</p>
                <p class="text-xs text-gray-400">{{user.count}} publicações · {{user.followers}} seguidores</p>
              </div>
              </div>
            </td>
            <td class="px-4 py-3 hidden md:table-cell">
              <span class="text-sm text-gray-600">{{user.email}}</span>
            </td>

            <td class="px-4 py-3 hidden lg:table-cell">
              <span class="text-sm text-gray-500">{{user.data}}</span>
            </td>

            <td class="px-4 py-3">
              <div class="flex items-center justify-end gap-2">
                <button (click)="deleteUser(user.id)" class="text-red-500 hover:text-red-700 p-1 hover:bg-red-50 rounded-lg transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor">
                        <path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v500h400v-500ZM360-240h80v-380h-80v380Zm160 0h80v-380h-80v380ZM280-720v500-500Z"/>
                    </svg>
                </button>
              </div>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>
 </div>
