<section>
    <div class="flex flex-col items-center justify-center min-h-screen bg-gray-100">
        <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center">Recuperar Senha</h2>
            <form (submit)="recuperar($event)" class="flex flex-col gap-4">
                <input type="email" [(ngModel)]="email" name="email" placeholder="Email" required class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl text-lg" [disabled]="!email">Enviar Link de Recuperação</button>
            </form>
            <p class="text-sm text-gray-600 mt-4 text-center">Lembou sua senha? <a href="/login" class="text-blue-600 hover:underline">Faça login</a></p>
            <p class="text-sm text-gray-600 mt-4 text-center">Não tem uma conta? <a href="/cadastrar" class="text-blue-600 hover:underline">Faça o Cadastro</a></p>
        </div>
    </div>
</section>
