<div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-purple-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-600 to-purple-600 mb-4 shadow-lg shadow-blue-200">
        <span class="text-white text-2xl font-bold">N</span>
      </div>
      <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
        NzolaNet
      </h1>
      <p class="text-gray-500 mt-1">Conecta-te com o mundo</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-xl shadow-gray-100 border border-gray-100 p-8">
      <h2 class="text-xl font-bold text-gray-900 mb-1">Bem-vindo de volta!</h2>
      <p class="text-sm text-gray-500 mb-6">Inicia sessão na tua conta</p>

      <!-- Erro -->
      @if (error) {
        <div class="mb-4 px-4 py-3 bg-red-50 border border-red-200 rounded-xl text-sm text-red-600">
          {{ error }}
        </div>
      }

      <form class="space-y-4" (ngSubmit)="onLogin($event)">

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="o.teu@email.com"
            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm bg-gray-50 placeholder-gray-400 transition"
          />
        </div>

        <!-- Senha -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-sm font-medium text-gray-700">Senha</label>
            <button a type="button" class="text-xs text-blue-600 hover:text-blue-700 font-medium transition-colors">
               <a routerLink="/recuperar-senha" class="text-blue-600 hover:underline">Esqueceste a senha?</a>
            </button>
          </div>
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="A tua senha"
            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm bg-gray-50 placeholder-gray-400 transition"
          />
        </div>

        <!-- Botão submit -->
        <button
          type="submit"
          [disabled]="loading"
          class="w-full flex items-center justify-center gap-2 py-3 px-4 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-xl font-semibold hover:from-blue-700 hover:to-purple-700 transition-all shadow-md shadow-blue-200 disabled:opacity-70 disabled:cursor-not-allowed">
          {{ loading ? 'A entrar...' : 'Entrar' }}
        </button>

        <p class="text-center text-sm text-gray-500 mt-6">
          Ainda não tens conta?
          <button class="text-blue-600 hover:text-blue-700 font-semibold transition-colors"> <a routerLink="/cadastrar">Regista-te aqui</a></button>
        </p>

      </form>
    </div>

  </div>
</div>
